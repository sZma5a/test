name: Create PR, watch checks, and merge

on:
  workflow_dispatch:
    inputs:
      test_branch:
        description: Test branch to create before opening the pull request
        required: true
        default: test1
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-watch-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_BRANCH: main
      TEST_BRANCH: ${{ inputs.test_branch }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.TEST_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEST_GITHUB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Write a random value to test.txt and push the test branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          branch="$TEST_BRANCH"
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$branch" "origin/$BASE_BRANCH"

          openssl rand -hex 16 > test.txt
          git add test.txt
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(ci): update test marker'
          git push --set-upstream origin "$branch"

          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create a pull request
        id: pull_request
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title 'chore(ci): verify PR checks watcher' \
            --body 'Created by the PR checks watcher verification workflow.')"

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks
        shell: bash
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          sleep 30
          gh pr checks "$PR_URL" --repo "$GITHUB_REPOSITORY" --required --watch --interval 5

      - name: Merge after required checks pass
        shell: bash
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --merge
